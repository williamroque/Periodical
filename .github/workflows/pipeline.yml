name: 'Daily Pipeline'

on:
  schedule:
    - cron: '30 1 * * 1-5'
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Check out repository'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 1

      - name: 'Restore previous data from gh-pages'
        run: |
          git fetch origin gh-pages --depth=1 || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout origin/gh-pages -- data/ || true
          fi

      - name: 'Set up Python'
        if: github.event_name != 'push'
        uses: 'actions/setup-python@v5'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 'Cache FastEmbed models'
        if: github.event_name != 'push'
        uses: 'actions/cache@v4'
        with:
          path: ~/.cache/fastembed
          key: 'fastembed-bge-small-en-v1.5'

      - name: 'Install dependencies'
        if: github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 'Run pipeline'
        id: pipeline
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python pipeline.py

      - name: 'Deploy snapshot to gh-pages'
        if: github.event_name == 'push' || steps.pipeline.outputs.updated == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan gh-pages
          git add -A
          if [ -d data ]; then git add -f data/; fi
          git commit -m 'Deploy site and daily data [skip ci]'
          git push --force origin gh-pages
